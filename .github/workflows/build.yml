name: Build JStudio Modern Final

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' 
          distribution: 'temurin'

      - name: Izin Eksekusi Gradle Wrapper
        run: chmod +x gradlew

      - name: Robot Penambal Kode (Java, XML, Manifest, PendingIntent)
        run: |
          echo "1. Mengubah Android Support lama menjadi AndroidX di JAVA..."
          find app/src/main/java -name "*.java" -exec sed -i 's/android.support.v4.content.FileProvider/androidx.core.content.FileProvider/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/android.support.v4.app.NotificationCompat/androidx.core.app.NotificationCompat/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/android.support.v4.app.ActivityCompat/androidx.core.app.ActivityCompat/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/android.support.v4.content.ContextCompat/androidx.core.content.ContextCompat/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/android.support.annotation.NonNull/androidx.annotation.NonNull/g' {} +
          
          echo "2. Mematikan kode WebView yang sudah dihapus Google..."
          find app/src/main/java -name "*.java" -exec sed -i 's/.*setAppCacheEnabled.*/\/\/ &/' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/.*setAppCachePath.*/\/\/ &/' {} +
          
          echo "3. Memperbaiki kode Firebase yang usang..."
          find app/src/main/java -name "*.java" -exec sed -i 's/FirebaseInstanceId.getInstance().getToken()/FirebaseMessaging.getInstance().getToken().toString()/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/import com.google.firebase.iid.FirebaseInstanceId;/\/\/ import com.google.firebase.iid.FirebaseInstanceId;/g' {} +
          
          echo "4. Menambahkan Import FirebaseMessaging..."
          find app/src/main/java -name "MainActivity.java" -exec sed -i '/import android.os.Bundle;/a import com.google.firebase.messaging.FirebaseMessaging;' {} +
          
          echo "5. Memperbaiki Ikon Notifikasi (bigLargeIcon)..."
          find app/src/main/java -name "MyFirebaseMessagingService.java" -exec sed -i 's/.bigLargeIcon(null)/.bigLargeIcon((android.graphics.Bitmap) null)/g' {} +

          echo "6. Memperbaiki Manifest (FileProvider & Peringatan)..."
          sed -i 's/package="com.curva.ppob"//g' app/src/main/AndroidManifest.xml
          sed -i 's/android.support.v4.content.FileProvider/androidx.core.content.FileProvider/g' app/src/main/AndroidManifest.xml
          
          echo "7. Memperbaiki Layout XML & PendingIntent..."
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/android.support.v4.widget.SwipeRefreshLayout/androidx.swiperefreshlayout.widget.SwipeRefreshLayout/g' {} +
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/android.support.v4.widget.DrawerLayout/androidx.drawerlayout.widget.DrawerLayout/g' {} +
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/android.support.design.widget.NavigationView/com.google.android.material.navigation.NavigationView/g' {} +
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/android.support.v7.widget.RecyclerView/androidx.recyclerview.widget.RecyclerView/g' {} +
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/android.support.v7.widget.CardView/androidx.cardview.widget.CardView/g' {} +
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/android.support.v7.widget.Toolbar/androidx.appcompat.widget.Toolbar/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/PendingIntent.FLAG_ONE_SHOT/PendingIntent.FLAG_ONE_SHOT | PendingIntent.FLAG_IMMUTABLE/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/PendingIntent.FLAG_UPDATE_CURRENT/PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE/g' {} +
          
          echo "8. Menambahkan Aturan Exported ke Manifest (Wajib Android 12+)..."
          sed -i 's/<activity android:name=".MainActivity"/<activity android:name=".MainActivity" android:exported="true"/g' app/src/main/AndroidManifest.xml

      - name: Build APK Release
        run: ./gradlew assembleRelease

      - name: Tandatangani (Sign) dengan Kunci Tetap
        run: |
          echo "1. Mencari Alat Penandatangan (apksigner)..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          
          echo "2. Mencari file APK mentah..."
          APK_FILE=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
          
          echo "3. Menandatangani menggunakan Kunci Master..."
          $APKSIGNER sign --ks KUNCI-RAHASIA.keystore --ks-pass pass:curvapayment123 --key-pass pass:curvapayment123 --ks-key-alias curva_alias "$APK_FILE"
          
          echo "4. Mengganti nama file hasil..."
          mv "$APK_FILE" app/build/outputs/apk/release/CurvaPayment-Modern.apk

      - name: Download Hasil Akhir
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Final-Siap-Publish
          path: app/build/outputs/apk/release/CurvaPayment-Modern.apk
