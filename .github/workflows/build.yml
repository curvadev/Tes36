name: Build JStudio Auto Web

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: false
        default: ''
      package_name:
        description: 'Package Name / App ID'
        required: false
        default: ''
      version_name:
        description: 'Versi Aplikasi Baru'
        required: false
        default: ''
      version_code:
        description: 'Kode Versi Baru'
        required: false
        default: ''
      min_sdk:
        description: 'Min SDK'
        required: false
        default: ''
      target_sdk:
        description: 'Target SDK'
        required: false
        default: ''
      logo_url:
        description: 'URL Gambar Logo Baru'
        required: false
        default: ''
      splash_url:
        description: 'URL Gambar Splash Baru'
        required: false
        default: ''
      google_services_url:
        description: 'URL google-services.json'
        required: false
        default: ''
      build_type:
        description: 'Tipe File'
        required: true
        default: 'both'
        type: choice
        options: [both, apk, aab]
      server_upload_url:
        description: 'URL API Web Penerima'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' 
          distribution: 'temurin'

      - name: Izin Eksekusi Gradle
        run: chmod +x gradlew

      - name: 1. Menerapkan Konfigurasi Dasar
        run: |
          echo "Memproses Parameter Dinamis..."
          if [ -n "${{ github.event.inputs.app_name }}" ]; then sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">${{ github.event.inputs.app_name }}<\/string>/g" app/src/main/res/values/strings.xml; fi
          if [ -n "${{ github.event.inputs.package_name }}" ]; then sed -i "s/applicationId \".*\"/applicationId \"${{ github.event.inputs.package_name }}\"/g" app/build.gradle; fi
          if [ -n "${{ github.event.inputs.version_name }}" ]; then sed -i "s/versionName \".*\"/versionName \"${{ github.event.inputs.version_name }}\"/g" app/build.gradle; fi
          if [ -n "${{ github.event.inputs.version_code }}" ]; then sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.version_code }}/g" app/build.gradle; fi
          if [ -n "${{ github.event.inputs.min_sdk }}" ]; then sed -i "s/minSdk .*/minSdk ${{ github.event.inputs.min_sdk }}/g" app/build.gradle; fi
          if [ -n "${{ github.event.inputs.target_sdk }}" ]; then sed -i "s/targetSdk .*/targetSdk ${{ github.event.inputs.target_sdk }}/g" app/build.gradle; fi
          if [ -n "${{ github.event.inputs.google_services_url }}" ]; then wget -O app/google-services.json "${{ github.event.inputs.google_services_url }}"; fi
          if [ -n "${{ github.event.inputs.logo_url }}" ]; then wget -O app/src/main/res/drawable/ic_launcher.png "${{ github.event.inputs.logo_url }}"; fi
          if [ -n "${{ github.event.inputs.splash_url }}" ]; then wget -O app/src/main/res/drawable/splash_logo.png "${{ github.event.inputs.splash_url }}"; fi

      - name: 2. Robot Upgrade Ke Google Code Scanner (Python)
        run: |
          python3 -c '
          import re
          # Suntik library ke Gradle
          with open("app/build.gradle", "r") as f: gradle = f.read()
          if "play-services-code-scanner" not in gradle:
              gradle = gradle.replace("dependencies {", "dependencies {\n    implementation \"com.google.android.gms:play-services-code-scanner:16.1.0\"\n")
              with open("app/build.gradle", "w") as f: f.write(gradle)
          
          # Bedah file Java dan ganti fungsi Scanner jadul
          with open("app/src/main/java/com/curva/ppob/MainActivity.java", "r") as f: java = f.read()
          
          old_func = r"private void scanBarcode\(\)\s*\{.*?(?=private void openContactPicker\(\))"
          new_func = """private void scanBarcode() {
              com.google.mlkit.vision.codescanner.GmsBarcodeScannerOptions options = new com.google.mlkit.vision.codescanner.GmsBarcodeScannerOptions.Builder().enableAutoZoom().build();
              com.google.mlkit.vision.codescanner.GmsBarcodeScanning.getClient(this, options).startScan()
                  .addOnSuccessListener(new com.google.android.gms.tasks.OnSuccessListener<com.google.mlkit.vision.barcode.common.Barcode>() {
                      @Override
                      public void onSuccess(com.google.mlkit.vision.barcode.common.Barcode barcode) {
                          final String res = barcode.getRawValue();
                          if (res != null) webView.post(new Runnable() { public void run() { webView.evaluateJavascript("javascript:onBarcodeScanned(\'" + res + "\')", null); } });
                      }
                  }).addOnFailureListener(new com.google.android.gms.tasks.OnFailureListener() {
                      @Override
                      public void onFailure(Exception e) { showToast("Scan gagal atau dibatalkan"); }
                  });
          }
          
          """
          
          java = re.sub(old_func, new_func, java, flags=re.DOTALL)
          with open("app/src/main/java/com/curva/ppob/MainActivity.java", "w") as f: f.write(java)
          '

      - name: 3. Robot Penambal Kode AndroidX (Java, XML, Manifest)
        run: |
          find app/src/main/java -name "*.java" -exec sed -i 's/android.support.v4.content.FileProvider/androidx.core.content.FileProvider/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/android.support.v4.app.NotificationCompat/androidx.core.app.NotificationCompat/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/android.support.v4.app.ActivityCompat/androidx.core.app.ActivityCompat/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/android.support.v4.content.ContextCompat/androidx.core.content.ContextCompat/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/android.support.annotation.NonNull/androidx.annotation.NonNull/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/.*setAppCacheEnabled.*/\/\/ &/' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/.*setAppCachePath.*/\/\/ &/' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/import com.google.firebase.iid.FirebaseInstanceId;/\/\/ import com.google.firebase.iid.FirebaseInstanceId;/g' {} +
          find app/src/main/java -name "MainActivity.java" -exec sed -i '/import android.os.Bundle;/a import com.google.firebase.messaging.FirebaseMessaging;' {} +
          find app/src/main/java -name "MyFirebaseMessagingService.java" -exec sed -i 's/.bigLargeIcon(null)/.bigLargeIcon((android.graphics.Bitmap) null)/g' {} +
          sed -i 's/package="com.curva.ppob"//g' app/src/main/AndroidManifest.xml
          sed -i 's/android.support.v4.content.FileProvider/androidx.core.content.FileProvider/g' app/src/main/AndroidManifest.xml
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/android.support.v4.widget.SwipeRefreshLayout/androidx.swiperefreshlayout.widget.SwipeRefreshLayout/g' {} +
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/android.support.v4.widget.DrawerLayout/androidx.drawerlayout.widget.DrawerLayout/g' {} +
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/android.support.design.widget.NavigationView/com.google.android.material.navigation.NavigationView/g' {} +
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/android.support.v7.widget.RecyclerView/androidx.recyclerview.widget.RecyclerView/g' {} +
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/android.support.v7.widget.CardView/androidx.cardview.widget.CardView/g' {} +
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/android.support.v7.widget.Toolbar/androidx.appcompat.widget.Toolbar/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/PendingIntent.FLAG_ONE_SHOT/PendingIntent.FLAG_ONE_SHOT | PendingIntent.FLAG_IMMUTABLE/g' {} +
          find app/src/main/java -name "*.java" -exec sed -i 's/PendingIntent.FLAG_UPDATE_CURRENT/PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE/g' {} +
          sed -i 's/<activity android:name=".MainActivity"/<activity android:name=".MainActivity" android:exported="true"/g' app/src/main/AndroidManifest.xml

      - name: 4. Build Aplikasi (Isolasi Tugas & Injeksi Memori)
        run: |
          echo "Menyuntikkan Memori Tambahan ke Mesin..."
          echo "" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          
          echo "Membersihkan Cache..."
          ./gradlew clean --no-daemon
          
          if [ "${{ github.event.inputs.build_type }}" == "apk" ] || [ "${{ github.event.inputs.build_type }}" == "both" ]; then 
            echo "Mencetak APK..."
            ./gradlew assembleRelease --no-daemon --max-workers=2
          fi
          
          if [ "${{ github.event.inputs.build_type }}" == "aab" ] || [ "${{ github.event.inputs.build_type }}" == "both" ]; then 
            echo "Mencetak AAB..."
            ./gradlew bundleRelease --no-daemon --max-workers=2
          fi

      - name: 5. Tandatangani Aplikasi
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          
          if [ "${{ github.event.inputs.build_type }}" == "apk" ] || [ "${{ github.event.inputs.build_type }}" == "both" ]; then
            APK_FILE=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
            $APKSIGNER sign --ks KUNCI-RAHASIA.keystore --ks-pass pass:curvapayment123 --key-pass pass:curvapayment123 --ks-key-alias curva_alias "$APK_FILE"
            mv "$APK_FILE" app/build/outputs/apk/release/CurvaPayment-Final.apk
          fi
          
          if [ "${{ github.event.inputs.build_type }}" == "aab" ] || [ "${{ github.event.inputs.build_type }}" == "both" ]; then
            AAB_FILE=$(find app/build/outputs/bundle/release -name "*-release.aab" | head -n 1)
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore KUNCI-RAHASIA.keystore -storepass curvapayment123 -keypass curvapayment123 "$AAB_FILE" curva_alias
            mv "$AAB_FILE" app/build/outputs/bundle/release/CurvaPayment-Final.aab
          fi

      - name: 6. Download Hasil ke Artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Final
          path: |
            app/build/outputs/apk/release/CurvaPayment-Final.apk
            app/build/outputs/bundle/release/CurvaPayment-Final.aab

      - name: 7. Kirim Hasil ke Server Admin Web
        if: github.event.inputs.server_upload_url != ''
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "apk" ] || [ "${{ github.event.inputs.build_type }}" == "both" ]; then
            curl -F "file=@app/build/outputs/apk/release/CurvaPayment-Final.apk" -F "token=RAHASIA_UPLOAD_123" "${{ github.event.inputs.server_upload_url }}"
          fi
          if [ "${{ github.event.inputs.build_type }}" == "aab" ] || [ "${{ github.event.inputs.build_type }}" == "both" ]; then
            curl -F "file=@app/build/outputs/bundle/release/CurvaPayment-Final.aab" -F "token=RAHASIA_UPLOAD_123" "${{ github.event.inputs.server_upload_url }}"
          fi
