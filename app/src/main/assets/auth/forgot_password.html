<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
    <title>Lupa Sandi - Curva Payment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f4f6f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        :root { --theme-color: #2196f3; --theme-hover: #1687e8; }
        .login-wrapper { width: 100%; max-width: 430px; }
        .login-card { background: white; border-radius: 24px; padding: 40px 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, .08); }
        .login-header { text-align: center; margin-bottom: 35px; }
        .icon-circle { width: 72px; height: 72px; background: #e0f2fe; color: var(--theme-color); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .icon-circle .material-symbols-rounded { font-size: 36px; }
        .login-title { font-size: 24px; font-weight: 800; color: #111827; margin-bottom: 8px; }
        .login-subtitle { font-size: 14px; color: #64748b; line-height: 1.5;}
        .alert-error { background: #fef2f2; border: 1px solid #fca5a5; color: #ef4444; padding: 14px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; margin-bottom: 24px; display: none; align-items: center; gap: 8px; text-align: left; }
        .alert-error.show { display: flex; }
        .floating-group { position: relative; margin-bottom: 24px; }
        .floating-label { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #94a3b8; transition: all 0.2s ease; pointer-events: none; background: white; padding: 0 4px; font-weight: 500; }
        .floating-label.active { top: 0; transform: translateY(-50%); font-size: 13px; color: var(--theme-color); font-weight: 700; }
        .floating-label.active-filled { top: 0; transform: translateY(-50%); font-size: 13px; color: #64748b; font-weight: 700; }
        .input-wrapper { display: flex; align-items: center; border: 2px solid #e5e7eb; border-radius: 16px; padding: 0 20px; background: white; transition: all .2s; height: 60px; position: relative; }
        .input-wrapper:focus-within { border-color: var(--theme-color); box-shadow: 0 0 0 4px rgba(33, 150, 243, .1); }
        .input-wrapper .input { border: none; padding: 0; height: 100%; flex: 1; font-size: 16px; font-weight: 600; color: #111827; outline: none; background: transparent; min-width: 0; }
        .btn-submit { width: 100%; height: 60px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--theme-color), var(--theme-hover)); color: white; font-size: 17px; font-weight: 700; cursor: pointer; transition: all .2s; box-shadow: 0 8px 20px rgba(33, 150, 243, .25); display: flex; align-items: center; justify-content: center; gap: 8px;}
        .back-link { display: block; text-align: center; margin-top: 24px; font-size: 15px; color: #64748b; font-weight: 600; text-decoration: none; }
        .spinner-small { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="icon-circle"><span class="material-symbols-rounded">lock_reset</span></div>
                <h2 class="login-title">Lupa Sandi?</h2>
                <p class="login-subtitle">Masukkan email terdaftar Anda untuk menerima kode pemulihan akun.</p>
            </div>
            <div class="alert-error" id="alertBox"><span class="material-symbols-rounded">error</span><span id="alertMessage"></span></div>

            <form id="forgotForm" autocomplete="off">
                <div class="floating-group">
                    <div class="input-wrapper">
                        <label class="floating-label" id="lblEmail">Alamat Email</label>
                        <input type="email" name="email" class="input" id="email" onfocus="handleFocus(this, 'lblEmail')" onblur="handleBlur(this, 'lblEmail')" oninput="handleInput(this, 'lblEmail')" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="btnSubmit">Kirim Kode OTP <span class="material-symbols-rounded">send</span></button>
            </form>
            <a href="login.html" class="back-link">Kembali ke Login</a>
        </div>
    </div>

    <script>
        function handleFocus(input, labelId) { document.getElementById(labelId).classList.add('active'); document.getElementById(labelId).classList.remove('active-filled'); }
        function handleBlur(input, labelId) { if (input.value.trim() === '') { document.getElementById(labelId).classList.remove('active', 'active-filled'); } else { document.getElementById(labelId).classList.remove('active'); document.getElementById(labelId).classList.add('active-filled'); } }
        function handleInput(input, labelId) { if (input.value.trim() !== '') { document.getElementById(labelId).classList.add('active-filled'); document.getElementById(labelId).classList.remove('active'); } }
        
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit'); const alertBox = document.getElementById('alertBox'); const alertMsg = document.getElementById('alertMessage');
            btn.style.pointerEvents = 'none'; btn.innerHTML = '<div class="spinner-small"></div> Memproses...'; alertBox.classList.remove('show');

            try {
                const response = await fetch('https://curva.web.id/ppob/api/auth/forgot_password.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('email').value }) });
                const data = await response.json();
                if (data.success) { localStorage.setItem('reset_email', data.email); window.location.href = "reset_password.html"; } else { alertMsg.textContent = data.message; alertBox.classList.add('show'); btn.style.pointerEvents = 'auto'; btn.innerHTML = 'Kirim Kode OTP <span class="material-symbols-rounded">send</span>'; }
            } catch (error) { alertMsg.textContent = "Gagal terhubung ke server."; alertBox.classList.add('show'); btn.style.pointerEvents = 'auto'; btn.innerHTML = 'Kirim Kode OTP <span class="material-symbols-rounded">send</span>'; }
        });
    </script>
</body>
</html>
