<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
    <title>Daftar - Curva Payment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f4f6f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        :root { --theme-color: #2196f3; --theme-hover: #1687e8; }
        .login-wrapper { width: 100%; max-width: 430px; }
        .login-card { background: white; border-radius: 24px; padding: 40px 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, .08); }
        .login-header { text-align: center; margin-bottom: 35px; }
        .login-image-logo { width: 180px; height: auto; object-fit: contain; margin-bottom: 12px; display: inline-block; }
        .login-subtitle { font-size: 15px; color: #64748b; margin-top: -14px; }
        .alert { padding: 14px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; margin-bottom: 24px; display: none; align-items: center; gap: 8px; line-height: 1.4; background: #fef2f2; border: 1px solid #fca5a5; color: #ef4444;}
        .alert.show { display: flex; }
        .alert .material-symbols-rounded { font-size: 20px; flex-shrink: 0; }
        .floating-group { position: relative; margin-bottom: 20px; }
        .floating-label { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #94a3b8; transition: all 0.2s ease; pointer-events: none; background: white; padding: 0 4px; font-weight: 500; }
        .floating-label.active { top: 0; transform: translateY(-50%); font-size: 13px; color: var(--theme-color); font-weight: 700; }
        .floating-label.active-filled { top: 0; transform: translateY(-50%); font-size: 13px; color: #64748b; font-weight: 700; }
        .input-wrapper { display: flex; align-items: center; border: 2px solid #e5e7eb; border-radius: 16px; padding: 0 20px; background: white; transition: all .2s; height: 60px; position: relative; }
        .input-wrapper:focus-within { border-color: var(--theme-color); box-shadow: 0 0 0 4px rgba(33, 150, 243, .1); }
        .input-wrapper .input { border: none; padding: 0; height: 100%; flex: 1; font-size: 16px; font-weight: 600; color: #111827; outline: none; background: transparent; min-width: 0; }
        .input-wrapper .input::placeholder { color: transparent; }
        .toggle-password { color: #94a3b8; cursor: pointer; padding-left: 10px; font-size: 24px; display: flex; align-items: center; user-select: none; transition: color .2s; }
        .toggle-password:active { color: var(--theme-color); }
        .btn-submit { width: 100%; height: 60px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--theme-color), var(--theme-hover)); color: white; font-size: 17px; font-weight: 700; cursor: pointer; transition: all .2s; box-shadow: 0 8px 20px rgba(33, 150, 243, .25); display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        .btn-submit:active { transform: scale(.97); }
        .register-link { text-align: center; margin-top: 28px; font-size: 15px; color: #64748b; font-weight: 500; }
        .register-link a { color: var(--theme-color); text-decoration: none; font-weight: 700; margin-left: 4px; }
        .spinner-small { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <img src="https://apps.curva.web.id/uploads/hosted_images/curva-new.png" alt="Curva Payment" class="login-image-logo">
                <p class="login-subtitle">Bergabung & Mulai Transaksi</p>
            </div>

            <div class="alert" id="alertBox">
                <span class="material-symbols-rounded">error</span>
                <span id="alertMessage"></span>
            </div>

            <form id="registerForm" autocomplete="off">
                <div class="floating-group">
                    <div class="input-wrapper">
                        <label class="floating-label" id="lblNama">Nama Lengkap</label>
                        <input type="text" name="nama" class="input" id="nama" onfocus="handleFocus(this, 'lblNama')" onblur="handleBlur(this, 'lblNama')" oninput="handleInput(this, 'lblNama')" required>
                    </div>
                </div>

                <div class="floating-group">
                    <div class="input-wrapper">
                        <label class="floating-label" id="lblHp">Nomor WhatsApp</label>
                        <input type="tel" name="no_hp" class="input" id="no_hp" onfocus="handleFocus(this, 'lblHp')" onblur="handleBlur(this, 'lblHp')" oninput="handleInput(this, 'lblHp')" required>
                    </div>
                </div>

                <div class="floating-group">
                    <div class="input-wrapper">
                        <label class="floating-label" id="lblEmail">Alamat Email</label>
                        <input type="email" name="email" class="input" id="email" onfocus="handleFocus(this, 'lblEmail')" onblur="handleBlur(this, 'lblEmail')" oninput="handleInput(this, 'lblEmail')" required>
                    </div>
                </div>

                <div class="floating-group">
                    <div class="input-wrapper">
                        <label class="floating-label" id="lblPassword">Kata Sandi Baru</label>
                        <input type="password" name="password" class="input" id="password" onfocus="handleFocus(this, 'lblPassword')" onblur="handleBlur(this, 'lblPassword')" oninput="handleInput(this, 'lblPassword')" required>
                        <span class="material-symbols-rounded toggle-password" onclick="togglePassword()">visibility_off</span>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">Daftar Sekarang <span class="material-symbols-rounded">arrow_forward</span></button>
            </form>
            <div class="register-link">Sudah punya akun? <a href="https://curva.web.id/ppob/auth/login.html">Masuk Disini</a></div>
        </div>
    </div>

    <script>
        // Bersihkan data lama untuk mencegah bug sesi
        localStorage.removeItem('temp_email');
        localStorage.removeItem('api_token');
        sessionStorage.clear();

        // Animasi Form Label (Efek Mengambang)
        function handleFocus(input, labelId) { document.getElementById(labelId).classList.add('active'); document.getElementById(labelId).classList.remove('active-filled'); }
        function handleBlur(input, labelId) { if (input.value.trim() === '') { document.getElementById(labelId).classList.remove('active', 'active-filled'); } else { document.getElementById(labelId).classList.remove('active'); document.getElementById(labelId).classList.add('active-filled'); } }
        function handleInput(input, labelId) { if (input.value.trim() !== '') { document.getElementById(labelId).classList.add('active-filled'); document.getElementById(labelId).classList.remove('active'); } }
        
        // Fitur Lihat Kata Sandi
        function togglePassword() { 
            const pwdInput = document.getElementById('password'); 
            const icon = document.querySelector('.toggle-password'); 
            if (pwdInput.type === 'password') { 
                pwdInput.type = 'text'; icon.textContent = 'visibility'; icon.style.color = 'var(--theme-color)'; 
            } else { 
                pwdInput.type = 'password'; icon.textContent = 'visibility_off'; icon.style.color = '#94a3b8'; 
            } 
        }
        
        // Proses Submit Form Pendaftaran
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit'); 
            const alertBox = document.getElementById('alertBox'); 
            const alertMsg = document.getElementById('alertMessage');
            
            // Ubah tombol jadi loading
            btn.style.pointerEvents = 'none'; 
            btn.innerHTML = '<div class="spinner-small"></div> Memproses...'; 
            alertBox.classList.remove('show');

            // Susun data yang mau dikirim ke API
            const payload = {
                nama: document.getElementById('nama').value,
                no_hp: document.getElementById('no_hp').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                // Eksekusi API Registrasi
                const response = await fetch('https://curva.web.id/ppob/api/auth/register.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    // Berhasil daftar! Simpan email sementara lalu pindah ke halaman verifikasi OTP
                    localStorage.setItem('temp_email', data.email);
                    window.location.href = "https://curva.web.id/ppob/auth/verify.html?type=" + data.type;
                } else {
                    // Jika gagal (contoh: email sudah terdaftar)
                    alertMsg.textContent = data.message;
                    alertBox.classList.add('show');
                    btn.style.pointerEvents = 'auto'; 
                    btn.innerHTML = 'Daftar Sekarang <span class="material-symbols-rounded">arrow_forward</span>';
                }
            } catch (error) {
                alertMsg.textContent = "Gagal terhubung ke server.";
                alertBox.classList.add('show');
                btn.style.pointerEvents = 'auto'; 
                btn.innerHTML = 'Daftar Sekarang <span class="material-symbols-rounded">arrow_forward</span>';
            }
        });
    </script>
</body>
</html>
