<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
    <title>Buat Sandi Baru - Curva Payment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f4f6f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        :root { --theme-color: #2196f3; --theme-hover: #1687e8; }
        .login-wrapper { width: 100%; max-width: 430px; }
        .login-card { background: white; border-radius: 24px; padding: 40px 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, .08); text-align: center; }
        .icon-circle { width: 72px; height: 72px; background: #e0f2fe; color: var(--theme-color); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .icon-circle .material-symbols-rounded { font-size: 36px; }
        .login-title { font-size: 24px; font-weight: 800; color: #111827; margin-bottom: 12px; }
        .login-subtitle { font-size: 14px; color: #64748b; line-height: 1.5; margin-bottom: 24px; }
        .alert-error { background: #fef2f2; border: 1px solid #fca5a5; color: #ef4444; padding: 14px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; margin-bottom: 24px; display: none; align-items: center; gap: 8px; text-align: left; }
        .alert-error.show { display: flex; }
        .otp-input { width: 100%; height: 60px; border: 2px solid #e5e7eb; border-radius: 16px; font-size: 28px; font-weight: 800; text-align: center; letter-spacing: 12px; color: #111827; outline: none; transition: all .2s; margin-bottom: 24px; background: #f8fafc;}
        .otp-input:focus { border-color: var(--theme-color); background: white; box-shadow: 0 0 0 4px rgba(33, 150, 244, .1); }
        .floating-group { position: relative; margin-bottom: 20px; text-align: left; }
        .floating-label { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 15px; color: #94a3b8; transition: all 0.2s ease; pointer-events: none; background: white; padding: 0 4px; font-weight: 500; }
        .floating-label.active { top: 0; transform: translateY(-50%); font-size: 12px; color: var(--theme-color); font-weight: 700; }
        .floating-label.active-filled { top: 0; transform: translateY(-50%); font-size: 12px; color: #64748b; font-weight: 700; }
        .input-wrapper { display: flex; align-items: center; border: 2px solid #e5e7eb; border-radius: 16px; padding: 0 20px; background: white; transition: all .2s; height: 55px; position: relative; }
        .input-wrapper:focus-within { border-color: var(--theme-color); box-shadow: 0 0 0 4px rgba(33, 150, 243, .1); }
        .input-wrapper .input { border: none; padding: 0; height: 100%; flex: 1; font-size: 15px; font-weight: 600; color: #111827; outline: none; background: transparent; min-width: 0; }
        .toggle-password { color: #94a3b8; cursor: pointer; padding-left: 10px; font-size: 22px; display: flex; align-items: center; user-select: none; transition: color .2s; }
        .btn-submit { width: 100%; height: 60px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--theme-color), var(--theme-hover)); color: white; font-size: 17px; font-weight: 700; cursor: pointer; transition: all .2s; box-shadow: 0 8px 20px rgba(33, 150, 243, .25); display: flex; align-items: center; justify-content: center; margin-top: 10px;}
        .back-link { display: block; margin-top: 24px; font-size: 15px; color: #64748b; font-weight: 600; text-decoration: none; }
        .spinner-small { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* MODALS */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; max-width: 520px; margin: auto; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 10000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-content { background: white; width: 85%; padding: 30px 24px; border-radius: 28px; text-align: center; transform: scale(0.9) translateY(20px); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); }
        .modal-overlay.show .modal-content { transform: scale(1) translateY(0); }
        .modal-icon-wrapper { background: #eff6ff; width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; color: var(--theme-color); }
        .modal-icon-wrapper .material-symbols-rounded { font-size: 36px; }
        .modal-title { font-size: 20px; font-weight: 800; color: #1e293b; margin-bottom: 10px; }
        .modal-text { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
        .modal-btn { background: var(--theme-color); color: white; border: none; width: 100%; padding: 14px; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all .2s; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="icon-circle"><span class="material-symbols-rounded">vpn_key</span></div>
            <h2 class="login-title">Buat Sandi Baru</h2>
            <p class="login-subtitle">Masukkan kode 6 digit dari email Anda beserta kata sandi baru.</p>
            <div class="alert-error" id="alertBox"><span class="material-symbols-rounded">error</span><span id="alertMessage"></span></div>

            <form id="resetForm" autocomplete="off">
                <input type="text" id="otp" class="otp-input" placeholder="------" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '');" autofocus required>
                <div class="floating-group">
                    <div class="input-wrapper">
                        <label class="floating-label" id="lblPassword">Kata Sandi Baru</label>
                        <input type="password" name="password" class="input" id="password" onfocus="handleFocus(this, 'lblPassword')" onblur="handleBlur(this, 'lblPassword')" oninput="handleInput(this, 'lblPassword')" required>
                        <span class="material-symbols-rounded toggle-password" onclick="togglePassword('password', this)">visibility_off</span>
                    </div>
                </div>
                <div class="floating-group">
                    <div class="input-wrapper">
                        <label class="floating-label" id="lblConfirmPassword">Ulangi Kata Sandi Baru</label>
                        <input type="password" name="confirm_password" class="input" id="confirm_password" onfocus="handleFocus(this, 'lblConfirmPassword')" onblur="handleBlur(this, 'lblConfirmPassword')" oninput="handleInput(this, 'lblConfirmPassword')" required>
                        <span class="material-symbols-rounded toggle-password" onclick="togglePassword('confirm_password', this)">visibility_off</span>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="btnSubmit">Ubah Kata Sandi</button>
            </form>
            <a href="login.html" class="back-link">Batal & Kembali</a>
        </div>
    </div>

    <!-- Modal Sukses -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <div class="modal-icon-wrapper"><span class="material-symbols-rounded">check_circle</span></div>
            <h3 class="modal-title">Berhasil</h3>
            <p class="modal-text">Kata sandi berhasil diubah! Silakan login kembali menggunakan sandi baru Anda.</p>
            <button class="modal-btn" onclick="window.location.href='login.html'">Masuk Sekarang</button>
        </div>
    </div>

    <script>
        const userEmail = localStorage.getItem('reset_email');
        if (!userEmail) { window.location.href = "forgot_password.html"; }

        function handleFocus(input, labelId) { document.getElementById(labelId).classList.add('active'); document.getElementById(labelId).classList.remove('active-filled'); }
        function handleBlur(input, labelId) { if (input.value.trim() === '') { document.getElementById(labelId).classList.remove('active', 'active-filled'); } else { document.getElementById(labelId).classList.remove('active'); document.getElementById(labelId).classList.add('active-filled'); } }
        function handleInput(input, labelId) { if (input.value.trim() !== '') { document.getElementById(labelId).classList.add('active-filled'); document.getElementById(labelId).classList.remove('active'); } }
        function togglePassword(inputId, iconElement) { const pwdInput = document.getElementById(inputId); if (pwdInput.type === 'password') { pwdInput.type = 'text'; iconElement.textContent = 'visibility'; iconElement.style.color = 'var(--theme-color)'; } else { pwdInput.type = 'password'; iconElement.textContent = 'visibility_off'; iconElement.style.color = '#94a3b8'; } }
        
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit'); const alertBox = document.getElementById('alertBox'); const alertMsg = document.getElementById('alertMessage');
            btn.style.pointerEvents = 'none'; btn.innerHTML = '<div class="spinner-small"></div> Memproses...'; alertBox.classList.remove('show');

            const payload = { email: userEmail, otp: document.getElementById('otp').value, password: document.getElementById('password').value, confirm_password: document.getElementById('confirm_password').value };

            try {
                const response = await fetch('https://curva.web.id/ppob/api/auth/reset_password.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await response.json();
                if (data.success) { localStorage.removeItem('reset_email'); document.getElementById('successModal').classList.add('show'); } 
                else { alertMsg.textContent = data.message; alertBox.classList.add('show'); btn.style.pointerEvents = 'auto'; btn.innerHTML = 'Ubah Kata Sandi'; }
            } catch (error) { alertMsg.textContent = "Gagal terhubung ke server."; alertBox.classList.add('show'); btn.style.pointerEvents = 'auto'; btn.innerHTML = 'Ubah Kata Sandi'; }
        });
    </script>
</body>
</html>
