<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
    <title>Verifikasi - Curva Payment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f3f4f6; display: flex; justify-content: center; min-height: 100vh; overscroll-behavior-y: none; }
        :root { --theme-color: #1791f4; }
        .app { width: 100%; max-width: 520px; background: white; min-height: 100vh; position: relative; display: flex; flex-direction: column; }
        .pin-container { flex: 1; display: flex; flex-direction: column; padding: 0; }
        .pin-header { text-align: center; margin-bottom: 30px; margin-top: 60px; padding: 0 20px;}
        .icon-circle { width: 72px; height: 72px; background: #e0f2fe; color: var(--theme-color); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .icon-circle .material-symbols-rounded { font-size: 36px; }
        .pin-title { font-size: 22px; font-weight: 800; color: #111827; margin-bottom: 8px; }
        .pin-subtitle { font-size: 14px; color: #64748b; line-height: 1.5; }
        .pin-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; }
        .pin-dot { width: 40px; height: 45px; border-radius: 12px; border: 2px solid #e2e8f0; background: #f8fafc; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #111827; transition: all .2s; }
        .pin-dot.filled { border-color: var(--theme-color); background: white; }
        .pin-dot.active { border-color: var(--theme-color); box-shadow: 0 0 0 4px rgba(23, 145, 244, .15); background: white; }
        .resend-box { text-align: center; font-size: 14px; color: #64748b; margin-bottom: 20px;}
        .resend-btn { background: none; border: none; color: var(--theme-color); font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s;}
        .resend-btn:disabled { color: #94a3b8; cursor: not-allowed; }
        .btn-batal { text-align: center; margin-bottom: 20px; font-size: 15px; color: #64748b; font-weight: 600; text-decoration: none; cursor: pointer; display: block;}
        .pin-keypad { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 15px; align-content: end; padding: 0 30px 40px;}
        .pin-key { width: 100%; height: 65px; border: none; border-radius: 16px; background: #f8fafc; font-size: 26px; font-weight: 600; color: #111827; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .pin-key:active { transform: scale(.95); background: #e2e8f0; }
        .pin-key.empty { background: transparent; cursor: default; }
        .pin-key.delete { background: transparent; color: #64748b; }
        .loading-overlay { position: fixed; inset:0; background: rgba(255, 255, 255, .8); z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
        .loading-overlay.show { display: flex; }
        .spinner { width: 36px; height: 36px; border: 4px solid #dbeafe; border-top: 4px solid var(--theme-color); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="app">
    <div class="pin-container">
        <div class="pin-header">
            <div class="icon-circle"><span class="material-symbols-rounded" id="pageIcon">mark_email_read</span></div>
            <h2 class="pin-title" id="pageTitle">Verifikasi Login</h2>
            <p class="pin-subtitle" id="pageSubtitle">Kode 6 digit telah dikirim ke email<br><strong id="userEmailTxt">-</strong></p>
        </div>
        
        <div class="pin-dots" id="pinDots">
            <div class="pin-dot" data-index="0"></div><div class="pin-dot" data-index="1"></div><div class="pin-dot" data-index="2"></div>
            <div class="pin-dot" data-index="3"></div><div class="pin-dot" data-index="4"></div><div class="pin-dot" data-index="5"></div>
        </div>

        <div class="resend-box">Belum menerima kode? <button type="button" class="resend-btn" id="btnResend" onclick="reqResendOTP()">Kirim Ulang</button></div>
        <a href="login.html" class="btn-batal">Batal & Kembali</a>

        <div class="pin-keypad">
            <button class="pin-key" onclick="pinInput('1')">1</button><button class="pin-key" onclick="pinInput('2')">2</button><button class="pin-key" onclick="pinInput('3')">3</button>
            <button class="pin-key" onclick="pinInput('4')">4</button><button class="pin-key" onclick="pinInput('5')">5</button><button class="pin-key" onclick="pinInput('6')">6</button>
            <button class="pin-key" onclick="pinInput('7')">7</button><button class="pin-key" onclick="pinInput('8')">8</button><button class="pin-key" onclick="pinInput('9')">9</button>
            <button class="pin-key empty"></button><button class="pin-key" onclick="pinInput('0')">0</button>
            <button class="pin-key delete" onclick="pinDelete()"><span class="material-symbols-rounded">backspace</span></button>
        </div>
    </div>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText" style="font-weight: bold; color: #111827;">Memvalidasi...</div>
    </div>
</div>

<script>
    const userEmail = localStorage.getItem('temp_email');
    if (!userEmail) window.location.href = "login.html";
    document.getElementById('userEmailTxt').innerText = userEmail;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('type') === 'register') {
        document.getElementById('pageTitle').innerText = "Aktivasi Akun";
        document.getElementById('pageIcon').innerText = "app_registration";
    }

    let currentInput = ''; let resendTimer = 60; let timerInterval;
    window.onload = startResendTimer;

    function startResendTimer() {
        const btn = document.getElementById('btnResend'); resendTimer = 60; btn.disabled = true; clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            resendTimer--; btn.innerText = `Tunggu (${resendTimer}s)`;
            if (resendTimer <= 0) { clearInterval(timerInterval); btn.innerText = "Kirim Ulang Sekarang"; btn.disabled = false; }
        }, 1000);
    }

    async function reqResendOTP() {
        showLoading("Mengirim ulang...");
        try {
            const res = await fetch('https://curva.web.id/ppob/api/auth/verify.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: userEmail, action: 'resend' }) });
            const data = await res.json(); hideLoading();
            if (data.success) { showMessage(data.message, '#16a34a'); startResendTimer(); resetInput(); } else { showMessage(data.message, '#ef4444'); }
        } catch (e) { hideLoading(); showMessage('Gagal koneksi.', '#ef4444'); }
    }

    function pinInput(val) { if (currentInput.length >= 6) return; currentInput += val; updatePinDots(); if (currentInput.length === 6) setTimeout(submitOTP, 150); }
    function pinDelete() { if (currentInput.length > 0) { currentInput = currentInput.slice(0, -1); updatePinDots(); showMessage('Kode dikirim ke email<br><strong>'+userEmail+'</strong>', '#64748b'); } }
    function updatePinDots() { document.querySelectorAll('.pin-dot').forEach((d, i) => { if(i < currentInput.length) { d.classList.add('filled'); d.classList.remove('active'); d.innerText = currentInput[i]; } else if (i === currentInput.length) { d.classList.remove('filled'); d.classList.add('active'); d.innerText = ''; } else { d.classList.remove('filled', 'active'); d.innerText = ''; } }); }

    async function submitOTP() {
        showLoading("Memvalidasi...");
        try {
            // Tembak API Verify
            const res = await fetch('https://curva.web.id/ppob/api/auth/verify.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: userEmail, otp: currentInput, action: 'verify' }) });
            const data = await res.json(); 
            
            if (data.success) {
                localStorage.removeItem('temp_email');
                showLoading("Menyiapkan Sesi Keamanan...");
                
                // Tembak Jembatan Siluman di Server agar menyimpan Cookie Sesi ke dalam WebView
                const bridgeRes = await fetch('https://curva.web.id/ppob/auth/bridge_api.php', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ token: data.token })
                });
                
                const bridgeData = await bridgeRes.json();
                if (bridgeData.success) {
                    
                    // ==========================================
                    // SIMPAN TOKEN HYBRID UNTUK MENCEGAH LOOPING
                    // ==========================================
                    if (bridgeData.hybrid_token) {
                        localStorage.setItem('hybrid_token', bridgeData.hybrid_token);
                    }
                    
                    // Meluncur ke Dashboard LOKAL
                    window.location.replace('../user/dashboard.html');
                } else {
                    hideLoading(); showMessage('Gagal mengamankan sesi.', '#ef4444'); resetInput();
                }
            } else { hideLoading(); showMessage(data.message, '#ef4444'); resetInput(); }
        } catch(e) { hideLoading(); showMessage('Gagal memvalidasi. Cek koneksi.', '#ef4444'); resetInput(); }
    }

    function resetInput() { currentInput = ''; updatePinDots(); }
    function showLoading(msg) { document.getElementById('loadingText').innerText = msg; document.getElementById('loadingOverlay').classList.add('show'); }
    function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }
    function showMessage(msg, color) { const s = document.getElementById('pageSubtitle'); s.innerHTML = msg; s.style.color = color; }
</script>
</body>
</html>
