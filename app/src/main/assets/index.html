<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Memuat - Curva Payment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #1791f4; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; padding: 20px; text-align: center;}
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        .status-text { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; animation: pulse 1.5s infinite; word-wrap: break-word; }
        .btn-retry { margin-top: 20px; padding: 10px 24px; border: 2px solid white; background: transparent; color: white; border-radius: 12px; font-weight: bold; cursor: pointer; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="spinner" id="spinner"></div>
    <div class="status-text" id="statusText">Menyiapkan Aplikasi...</div>
    <button class="btn-retry" id="btnRetry" onclick="location.reload()">Coba Lagi</button>

    <script>
        async function checkSession() {
            try {
                const response = await fetch('https://curva.web.id/ppob/api/dashboard.php', {
                    method: 'GET',
                    credentials: 'include' 
                });
                
                // Cek apakah server membalas dengan error PHP alih-alih data JSON
                const text = await response.text();
                try {
                    const data = JSON.parse(text);
                    if (data.status === 'success') {
                        window.location.replace('user/dashboard.html');
                    } else {
                        window.location.replace('auth/login.html');
                    }
                } catch (jsonError) {
                    // Jika data rusak (bukan JSON), tampilkan pesan error dari server
                    tampilkanError("Server merespons tidak valid. (PHP Error)");
                    console.log("Response aslinya: ", text);
                }

            } catch (error) {
                // Jika murni masalah jaringan atau CORS diblokir
                tampilkanError("Gagal mengambil data: " + error.message);
            }
        }
        
        function tampilkanError(pesan) {
            document.getElementById('statusText').innerText = pesan;
            document.getElementById('statusText').style.animation = "none";
            document.getElementById('spinner').style.display = "none";
            document.getElementById('btnRetry').style.display = "block";
        }

        window.addEventListener('load', () => { setTimeout(checkSession, 500); });
    </script>
</body>
</html>
