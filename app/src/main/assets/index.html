<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Memuat - Curva Payment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: #1791f4; /* Warna biru tema aplikasi Anda */
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            color: white;
        }
        .spinner { 
            width: 40px; 
            height: 40px; 
            border: 4px solid rgba(255,255,255,0.3); 
            border-top: 4px solid white; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin-bottom: 20px;
        }
        .status-text {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            animation: pulse 1.5s infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <!-- Animasi Loading saat mengecek Sesi secara online -->
    <div class="spinner"></div>
    <div class="status-text" id="statusText">Menyiapkan Aplikasi...</div>

    <script>
        async function checkSession() {
            try {
                // Tembak API Dashboard di server secara diam-diam untuk mengecek Sesi
                // WAJIB pakai credentials: 'include' agar Sesi (Cookie) dikirim ke server
                const response = await fetch('https://curva.web.id/ppob/api/dashboard.php', {
                    method: 'GET',
                    credentials: 'include' 
                });
                
                const data = await response.json();

                if (data.status === 'success') {
                    // Jika Server membalas "Sukses", meluncur ke Dashboard lokal
                    window.location.replace('user/dashboard.html');
                } else {
                    // Jika Server membalas "Sesi kosong / unauthorized", arahkan ke Login lokal
                    window.location.replace('auth/login.html');
                }
            } catch (error) {
                // Jika sedang tidak ada sinyal internet, jangan tampilkan error jelek, 
                // tapi coba lagi otomatis setiap 3 detik.
                document.getElementById('statusText').innerText = "Menunggu jaringan...";
                document.getElementById('statusText').style.animation = "none";
                
                setTimeout(checkSession, 3000);
            }
        }
        
        // Mulai pengecekan setelah 0.5 detik agar transisi dari splash screen Android terasa smooth
        window.addEventListener('load', () => {
            setTimeout(checkSession, 500);
        });
    </script>
</body>
</html>
